#
# Workspace classpath for the Legend Pure repository.
#
# Picked up by the `legend lsp` ancestor walk and by the IntelliJ
# plugin's project-base discovery, so opening this directory (or any
# descendant) in an IDE gives the LSP a complete, source-of-truth
# picture of the platform.
#
# Every entry is a `kind = "filesystem"` repo backed by the Java
# module's `src/main/resources/<name>` source root, with the
# canonical `*.definition.json` descriptor declaring the package
# pattern + transitive dependencies. The descriptor's `name` (read
# at load time) matches the prefix used in `<repo>::<package>::…`
# canonical URLs.
#
# `kind = "filesystem"` (not `kind = "purem"`) is intentional: the
# LSP picks up edits live, no rebuild step. Trade `~1s` slower
# initial compile for full edit-time fidelity.

# ---- M3 core platform -----------------------------------------------------

[[repo]]
name       = "platform"
kind       = "filesystem"
descriptor = "legend-pure-core/legend-pure-m3-core/src/main/resources/platform.json"

# ---- M3 precise primitives ------------------------------------------------

[[repo]]
name       = "platform_precise_primitives"
kind       = "filesystem"
descriptor = "legend-pure-core/legend-pure-m3-precisePrimitives/src/main/resources/platform_precise_primitives.definition.json"

