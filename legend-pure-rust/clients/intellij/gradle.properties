# Plugin coordinates -----------------------------------------------------------
pluginGroup = org.finos.legend.pure
pluginName = legend-pure-intellij
pluginVersion = 0.1.0-SNAPSHOT

# Plugin descriptor — must match plugin.xml ----------------------------------
# 253 = IDEA 2025.3 (Dec 8 2025). Bumped from 2025.2.1 because that build
# was missing the native LSP→Search Everywhere wiring — `LspGoToSymbolContributor`
# and `LspGoToClassContributor` were registered but never invoked, so Cmd+O /
# Cmd+Alt+O / Symbols tab returned nothing for LSP-managed files. 2025.3
# ships that wiring (ticket IJPL-189547) plus six other LSP API features
# (signatureHelp, documentHighlight, documentSymbol-driven Structure /
# Breadcrumbs / Sticky Lines, server-initiated $/progress).
# Refs:
#   https://platform.jetbrains.com/t/2025-3-new-lsp-api-features/3048
#   https://blog.jetbrains.com/idea/2025/12/intellij-idea-2025-3/
pluginSinceBuild = 253
pluginUntilBuild = 253.*

# IntelliJ Platform target ----------------------------------------------------
# `IU` (IntelliJ IDEA Ultimate distribution) is the development-time
# platform identifier — the resulting plugin runs on the unified IDEA
# installer for both subscribers and free-tier users from 2025.3 onward.
platformType = IU
platformVersion = 2025.3

# Bundled platform plugins required at compile + run time.
# Keep both id and version-coupled deps in build.gradle.kts.
platformBundledPlugins =
platformPlugins =

# JVM toolchain used to compile the plugin --------------------------------
# IDEA 2025.2.1 ships on JDK 21 and requires sourceCompatibility=21.
jdkVersion = 21

# Gradle perf / convenience flags --------------------------------------------
org.gradle.parallel = true
org.gradle.caching = true
org.gradle.configuration-cache = true

# Use the kotlin-stdlib bundled with the IntelliJ Platform rather than the
# version pulled in by the Kotlin Gradle plugin — keeps our plugin in
# lockstep with the platform's runtime. https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false
