[package]
name = "legend-pure-dsl-relational-runtime"
description = "Runtime-side DSL-instance populator for the Relational DSL — hydrates `Database.schemas` / `tables` / `joins` / `filters` heap rows so Pure-side reflection over relational stores returns populated children."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
legend-pure-dsl-relational = { path = "../dsl-relational" }
legend-pure-runtime = { path = "../runtime" }
legend-pure-parser-pure = { path = "../pure" }
smol_str = { workspace = true }

[dev-dependencies]
indoc = "2"
legend-pure-parser-ast = { path = "../ast" }
legend-pure-parser-parser = { path = "../parser" }
# For the end-to-end main_table_wiring_smoke that wires Mapping +
# Database + RelationalClassMapping populators together.
legend-pure-dsl-mapping = { path = "../dsl-mapping" }
legend-pure-dsl-mapping-runtime = { path = "../dsl-mapping-runtime" }
