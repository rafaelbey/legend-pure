[package]
name = "legend-pure-lsp"
description = "Language Server Protocol server for the Legend Pure language"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
legend-pure-parser-ast = { path = "../ast" }
legend-pure-parser-parser = { path = "../parser" }
legend-pure-parser-pure = { path = "../pure" }
legend-pure-core-platform = { path = "../core-platform-pure" }
# Runtime: needed for `workspace/executeCommand` to evaluate
# parameterless Pure functions from the gutter ▶ Run icon. The LSP
# already has the workspace's compiled `PureModel` in memory, so
# running the function in-process is materially cheaper (no model
# rebuild) AND correct (sees the workspace's classpath + open
# buffers) compared to shelling out to `legend run`.
legend-pure-runtime = { path = "../runtime" }
# DSL extensions — the LSP is the integration point that owns
# DSL knowledge so `core-platform-pure` can stay below them in
# the dep graph.
legend-pure-dsl-mapping = { path = "../dsl-mapping" }
legend-pure-dsl-relational = { path = "../dsl-relational" }
legend-pure-dsl-store = { path = "../dsl-store" }

tower-lsp-server = { workspace = true }
tokio = { workspace = true }
dashmap = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
legend-pure-parser-parser = { path = "../parser" }
tempfile = { workspace = true }
