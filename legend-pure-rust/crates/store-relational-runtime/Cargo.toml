[package]
name = "legend-pure-store-relational-runtime"
description = "Runtime extension wiring DuckDB-backed native function bodies for `meta::relational::metamodel::execute::*` (executeInDb, loadCsv/Values, fetch*Metadata, createTempTable, dropTempTable). Per-Evaluator connection lifecycle; concurrent evaluators each get an independent in-memory DuckDB."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
legend-pure-runtime = { path = "../runtime" }
legend-pure-parser-pure = { path = "../pure" }
legend-pure-parser-ast = { path = "../ast" }
smol_str = { workspace = true }
tracing = { workspace = true }
jiff = { workspace = true }
rust_decimal = { workspace = true }

# DuckDB Rust driver. `bundled` builds libduckdb from source so no
# system install is needed; adds 30-60s to cold builds, then cached.
duckdb = { version = "1.4", features = ["bundled"] }

[dev-dependencies]
# End-to-end smoke tests compile synthetic user Pure source against
# the full platform model (including `platform_store_relational`).
legend-pure-core-platform = { path = "../core-platform-pure" }
