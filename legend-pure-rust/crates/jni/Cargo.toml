[package]
name = "legend-pure-parser-jni"
description = "JNI bridge exposing the Rust Pure parser to Java"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "pure_rust_jni"
# Dual-crate-type: the in-tree build still produces the canonical
# `libpure_rust_jni.{dylib,so,dll}` shipped to Java consumers, AND
# downstream cdylibs can pull this crate in as an rlib dependency
# (which preserves the `#[no_mangle] pub extern "system" fn Java_*`
# symbols through static linking) to produce their OWN JNI cdylib
# that bundles their custom extensions. See
# `docs/extensions/downstream-recipe.md` §11.1 and the worked
# `examples/mydsl-jni-extension/` template.
crate-type = ["rlib", "cdylib"]

[dependencies]
legend-pure-parser-ast = { path = "../ast" }
legend-pure-parser-lexer = { path = "../lexer" }
legend-pure-parser-parser = { path = "../parser" }
legend-pure-parser-protocol = { path = "../protocol" }
legend-pure-parser-pure = { path = "../pure" }
legend-pure-runtime = { path = "../runtime" }
legend-pure-core-platform = { path = "../core-platform-pure" }
legend-pure-java-codegen = { path = "../java-codegen" }
slotmap = { workspace = true }
smol_str = { workspace = true }
im-rc = { workspace = true }
jni = { workspace = true }
# `toml::Value` is the type carried by `[extension.<…>]` tables from
# the parsed classpath through the Evaluator's `set_extension_configs`.
# Shared between core-platform-pure's classpath parser and JNI's
# nativeInitContextWithClasspath entry point.
toml = "0.8"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
