[package]
name = "legend-pure-ide"
description = "IDE tooling layer for Legend Pure — Reference / ReferenceIndex data model, model-walking reference collector, and IdeExtension plug-in trait. Sits one layer above legend-pure-parser-pure (the semantic/compiler layer) so the compiler stays free of IDE concerns."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
legend-pure-parser-ast = { path = "../ast" }
legend-pure-parser-pure = { path = "../pure" }
serde = { workspace = true, features = ["derive"] }
smol_str = { workspace = true, features = ["serde"] }
linkme = { workspace = true }
