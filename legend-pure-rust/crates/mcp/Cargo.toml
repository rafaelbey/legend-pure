[package]
name = "legend-pure-mcp"
description = "Model Context Protocol server for Legend Pure — exposes the compiled workspace as MCP tools so AI coding agents can search symbols, run functions, and query diagnostics."
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
legend-pure-parser-ast = { path = "../ast" }
legend-pure-parser-parser = { path = "../parser" }
legend-pure-parser-pure = { path = "../pure" }
legend-pure-core-platform = { path = "../core-platform-pure" }
# IDE-tier reference index: `find_references` resolves an FQN to an
# `ElementId` and looks up its reverse-references via
# `ReferenceIndex::usages_of`. Same crate the LSP uses for
# `textDocument/references`, so both protocols agree on what counts
# as a reference site.
legend-pure-ide = { path = "../ide" }
# Runtime: the runner module — `run_function`, `run_test`, `run_pct`,
# `list_pct_adapters` — is shared with `legend-pure-lsp`'s
# `workspace/executeCommand` so both protocols stay in lock-step on
# the evaluation path.
legend-pure-runtime = { path = "../runtime" }
# DSL extensions — same rationale as `legend-pure-lsp` /
# `legend-pure-dap`: the integration crate owns DSL knowledge so the
# `core-platform-pure` crate can stay below them in the dep graph.
legend-pure-dsl-mapping = { path = "../dsl-mapping" }
legend-pure-dsl-relational = { path = "../dsl-relational" }
legend-pure-dsl-store = { path = "../dsl-store" }
# Runtime-side extensions wired into every `run_function` / `run_test`
# / `run_pct` call so the MCP's executors match the `legend test` CLI
# exactly: relational natives (`executeInDb`, `createTempTable*`, …)
# plus the Mapping + Relational DSL populators that hydrate
# `Element::DSLInstance` heap rows. Inlined at all 3 call sites for
# now; the distributed-slice backlog item will collapse this into a
# single auto-registered setup.
legend-pure-dsl-mapping-runtime = { path = "../dsl-mapping-runtime" }
legend-pure-dsl-relational-runtime = { path = "../dsl-relational-runtime" }
legend-pure-store-relational-runtime = { path = "../store-relational-runtime" }

# Official Anthropic MCP SDK.
#   server         — server-side surface (default-on, listed
#                    explicitly so the dep graph documents intent).
#   macros         — `#[tool]` / `#[tool_router]` / `#[tool_handler]`
#                    attribute macros that generate the JSON-Schema
#                    routing.
#   transport-io   — stdio transport implementation.
rmcp = { version = "1", features = ["server", "macros", "transport-io"] }
schemars = "0.8"

tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# RFC 3339 timestamps for `workspace_status` / `reload_workspace`.
# Already a workspace dep via `legend-pure-runtime`.
jiff = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# `apply_edit` is async; the integration test invokes it directly on
# the server struct, which means the test driver needs a tokio
# runtime. Use the multi-thread flavor + `macros` for `#[tokio::test]`.
tokio = { workspace = true, features = ["macros"] }
