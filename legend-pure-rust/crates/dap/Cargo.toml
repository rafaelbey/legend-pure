[package]
name = "legend-pure-dap"
description = "Debug Adapter Protocol server for the Legend Pure language"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
legend-pure-parser-ast = { path = "../ast" }
legend-pure-parser-parser = { path = "../parser" }
legend-pure-parser-pure = { path = "../pure" }
legend-pure-core-platform = { path = "../core-platform-pure" }
# Runtime: the evaluator (driven with custom DAP hooks) lives here.
# Shares the workspace's compiled `PureModel` discovery + evaluation
# path with `legend-pure-lsp` — same in-process model means the
# debugger sees the user's classpath + open buffers, not just the
# embedded platform.
legend-pure-runtime = { path = "../runtime" }
# DSL extensions — same rationale as in `legend-pure-lsp`: the
# integration crate owns DSL knowledge so `core-platform-pure` can
# stay below them in the dep graph.
legend-pure-dsl-mapping = { path = "../dsl-mapping" }
legend-pure-dsl-relational = { path = "../dsl-relational" }
legend-pure-dsl-store = { path = "../dsl-store" }

tokio = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
