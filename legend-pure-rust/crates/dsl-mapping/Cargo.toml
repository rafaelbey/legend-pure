[package]
name = "legend-pure-dsl-mapping"
description = "Mapping DSL scaffold for Legend Pure (`###Mapping` section + processors land in stages 2+)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# Stage 1 (this crate) is metamodel-only: the `platform_dsl_mapping`
# repo embeds without a section parser or processor. The deps below are
# the minimum needed for `MappingExtension` to satisfy the
# `CompilerExtension` trait. Stages 2+ will pull in `parser` (for the
# `###Mapping` SectionParser), `compose`, `lexer`, `protocol`.
[dependencies]
legend-pure-parser-pure = { path = "../pure" }

[dev-dependencies]
# end_to_end.rs loads the embedded platform repos to assert that the
# mapping metamodel resolves once Stage 1 has wired the descriptor.
legend-pure-core-platform = { path = "../core-platform-pure" }
smol_str = { workspace = true }
