[package]
name = "legend-pure-dsl-mapping"
description = "Mapping DSL scaffold for Legend Pure (`###Mapping` section + processors land in stages 2+)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# Stage 2 dependencies:
# - parser-ast: AST node types (Lambda, Expression, SourceInfo, …)
# - parser-parser: SectionParser trait + ParserContext for body grammar
# - parser-lexer: TokenKind enum
# - parser-pure: CompilerExtension trait
[dependencies]
legend-pure-parser-ast = { path = "../ast" }
legend-pure-parser-parser = { path = "../parser" }
legend-pure-parser-lexer = { path = "../lexer" }
legend-pure-parser-pure = { path = "../pure" }
legend-pure-ide = { path = "../ide" }
legend-pure-parser-compose = { path = "../compose" }
legend-pure-parser-protocol = { path = "../protocol" }
postcard = { version = "1", features = ["alloc"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
smol_str = { workspace = true, features = ["serde"] }
linkme = { workspace = true }

[dev-dependencies]
indoc = "2"
insta = { workspace = true, features = ["redactions"] }
# end_to_end.rs loads the embedded platform repos and exercises the
# section parser end-to-end.
legend-pure-core-platform = { path = "../core-platform-pure" }
