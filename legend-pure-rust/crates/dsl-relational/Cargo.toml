[package]
name = "legend-pure-dsl-relational"
description = "Relational store DSL for Legend Pure (`###Relational` section + Database/Schema/Table/View/Join/Filter grammar)"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

# Stage 1 dependencies:
# - parser-ast: SourceInfo, identifiers, packageable element pointers
# - parser-parser: SectionParser trait + ParserContext for body grammar
# - parser-lexer: TokenKind enum
[dependencies]
legend-pure-parser-ast = { path = "../ast" }
legend-pure-parser-parser = { path = "../parser" }
legend-pure-parser-lexer = { path = "../lexer" }
smol_str = { workspace = true }

[dev-dependencies]
indoc = "2"
# end_to_end.rs loads the embedded platform repos and exercises the
# section parser against a real Java fixture's relational source.
legend-pure-core-platform = { path = "../core-platform-pure" }
legend-pure-parser-pure = { path = "../pure" }
