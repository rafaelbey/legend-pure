[package]
name = "legend-pure-core-platform"
version.workspace = true
edition.workspace = true
publish = false

# Each repo points at its existing Java descriptor JSON; everything else
# (name, source directory, canonical URL prefix, dependency graph, package
# pattern) is derived from the JSON. See `build.rs` and `src/repo.rs`.
#
# Shape values:
# - `purem-embedded` — compile to .purem at build time, include_bytes!
#   into the binary. The bare-minimum bootstrap every binary always
#   carries. Today: just `platform`.
# - `purem-artifact`  — compile to .purem at build time, write to
#   `target/<profile>/snapshots/<name>.purem` next to the produced
#   binaries. The CLI's classpath auto-discovery picks them up at
#   runtime. Used for every non-platform repo; users override via
#   --classpath / LEGEND_PURE_CLASSPATH for live development.

[[package.metadata.legend-pure.repos]]
descriptor = "../../../legend-pure-core/legend-pure-m3-core/src/main/resources/platform.json"
shape = "purem-embedded"

[[package.metadata.legend-pure.repos]]
descriptor = "../../../legend-pure-core/legend-pure-m3-precisePrimitives/src/main/resources/platform_precise_primitives.definition.json"
shape = "purem-artifact"

[[package.metadata.legend-pure.repos]]
descriptor = "../../../legend-pure-dsl/legend-pure-dsl-store/legend-pure-m2-dsl-store-pure/src/main/resources/platform_dsl_store.definition.json"
shape = "purem-artifact"

[[package.metadata.legend-pure.repos]]
descriptor = "../../../legend-pure-dsl/legend-pure-dsl-mapping/legend-pure-m2-dsl-mapping-pure/src/main/resources/platform_dsl_mapping.definition.json"
shape = "purem-artifact"

[[package.metadata.legend-pure.repos]]
descriptor = "../../../legend-pure-dsl/legend-pure-dsl-diagram/legend-pure-m2-dsl-diagram-pure/src/main/resources/platform_dsl_diagram.definition.json"
shape = "purem-artifact"

[[package.metadata.legend-pure.repos]]
descriptor = "../../../legend-pure-dsl/legend-pure-dsl-graph/legend-pure-m2-dsl-graph-pure/src/main/resources/platform_dsl_graph.definition.json"
shape = "purem-artifact"

[[package.metadata.legend-pure.repos]]
descriptor = "../../../legend-pure-dsl/legend-pure-dsl-tds/legend-pure-m2-dsl-tds-pure/src/main/resources/platform_dsl_tds.definition.json"
shape = "purem-artifact"

[[package.metadata.legend-pure.repos]]
descriptor = "../../../legend-pure-dsl/legend-pure-dsl-path/legend-pure-m2-dsl-path-pure/src/main/resources/platform_dsl_path.definition.json"
shape = "purem-artifact"

[[package.metadata.legend-pure.repos]]
descriptor = "../../../legend-pure-store/legend-pure-store-relational/legend-pure-m2-store-relational-pure/src/main/resources/platform_store_relational.definition.json"
shape = "purem-artifact"

[dependencies]
legend-pure-parser-parser = { path = "../parser" }
legend-pure-parser-ast = { path = "../ast" }
legend-pure-parser-pure = { path = "../pure" }
legend-pure-dsl-graph = { path = "../dsl-graph" }
legend-pure-dsl-store = { path = "../dsl-store" }
legend-pure-dsl-tds = { path = "../dsl-tds" }
serde = { workspace = true }
serde_json = { workspace = true }
smol_str = { workspace = true }
thiserror = { workspace = true }
# Classpath TOML parsing shared by `legend-cli` and `legend-pure-parser-jni`.
# Kept here (next to the `Repo` abstraction it produces) so the JNI cdylib
# doesn't have to pull in `legend-cli`'s much larger dep tree (rustyline,
# notify, owo_colors, lsp/dap/mcp, …) just to parse a classpath TOML.
toml = "0.8"
tracing = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Needed by repo.rs's section-parser-dispatch regression test, which
# defines a tiny in-test `SectionParser` and consumes tokens via the
# lexer's `TokenKind`.
legend-pure-parser-lexer = { path = "../lexer" }

[build-dependencies]
legend-pure-build = { path = "../build" }
