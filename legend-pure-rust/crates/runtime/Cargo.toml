[package]
name = "legend-pure-runtime"
description = "Pure Runtime — interpreter, runtime heap, and execution engine for Legend Pure"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
legend-pure-parser-pure = { path = "../pure" }
legend-pure-parser-ast = { path = "../ast" }
legend-pure-core-platform = { path = "../core-platform-pure" }
legend-pure-dsl-tds = { path = "../dsl-tds" }
smol_str = { workspace = true }
thiserror = { workspace = true }
im-rc = { workspace = true }
rust_decimal = { workspace = true }
jiff = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
legend-pure-parser-parser = { path = "../parser" }
legend-pure-core-platform = { path = "../core-platform-pure" }
legend-pure-dsl-graph = { path = "../dsl-graph" }
# Wire the relational extension + DSL populators into the root
# surveyor test: the platform now ships `<<test.Test>>` functions
# under `meta::relational::tests::*` that exercise the DuckDB-backed
# natives. Dev-deps only — no production runtime dependency cycle.
legend-pure-store-relational-runtime = { path = "../store-relational-runtime" }
legend-pure-dsl-mapping-runtime = { path = "../dsl-mapping-runtime" }
legend-pure-dsl-relational-runtime = { path = "../dsl-relational-runtime" }
criterion = { version = "0.5", features = ["html_reports"] }
tracing-subscriber = { workspace = true }

[[bench]]
name = "runtime_micro"
harness = false

[[bench]]
name = "runtime_eval"
harness = false

[[bench]]
name = "heap_growth"
harness = false
