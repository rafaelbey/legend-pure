[workspace]
resolver = "2"
members = [
    "crates/ast",
    "crates/ast-derive",
    "crates/build",
    "crates/compose",
    "crates/lexer",
    "crates/parser",
    "crates/protocol",
    "crates/pure",
    "crates/runtime",
    "crates/jni",
    "crates/java-codegen",
    "crates/cli",
    "crates/core-platform-pure",
    "crates/snapshot-builder",
    "crates/dsl-diagram",
    "crates/dsl-graph",
    "crates/dsl-mapping",
    "crates/dsl-mapping-runtime",
    "crates/dsl-relational",
    "crates/dsl-relational-runtime",
    "crates/dsl-store",
    "crates/store-relational-runtime",
    "crates/dsl-tds",
    "crates/lsp",
    "crates/dap",
    "crates/stress",
    "crates/xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/finos/legend-engine"

[workspace.dependencies]
# Core
smol_str = "0.3"
thiserror = "2"
legend-pure-parser-ast-derive = { path = "crates/ast-derive" }

# Runtime (persistent data structures + heap + temporal + decimal)
im-rc = "15"
slotmap = "1"
rust_decimal = "1"
jiff = { version = "0.2", features = ["std"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parallelism
rayon = "1"

# Coverage (LCOV tracefile read/write/merge — only dep is thiserror)
lcov = "0.8"

# Serialization (protocol crate only)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JNI
jni = "0.21"

# Plugins
linkme = "0.3"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Proc-macro (ast-derive)
syn = "2"
quote = "1"
proc-macro2 = "1"

# Regex (used for repo `pattern` enforcement; Java-syntax patterns
# from descriptors are wrapped as `^(?:…)$` to mirror Java's anchored
# `Matcher.matches()` semantics)
regex = "1"

# CLI
clap = { version = "4", features = ["derive", "color"] }
clap_complete = "4"
miette = { version = "7", features = ["fancy"] }
owo-colors = "4"
walkdir = "2"
rustyline = "18"
notify = "8.0.0"
notify-debouncer-mini = "0.7.0"

# LSP server. tower-lsp-server is the maintained community fork of the
# original (now-unmaintained) tower-lsp 0.20. Migration notes vs. 0.20:
#   - re-exports LSP types under `ls_types` (was `lsp_types`)
#   - trait drops `#[async_trait]` — `async fn` directly in `impl`
#   - `workspace/symbol` returns `WorkspaceSymbolResponse` so we can
#     emit the modern `WorkspaceSymbol[]` shape (the old shape emits
#     the now-deprecated `SymbolInformation[]`)
tower-lsp-server = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }
dashmap = "6"

[workspace.metadata.llvm-cov]
# Exclude JNI bridge and stress tests from coverage
exclude = ["legend-pure-parser-jni", "legend-pure-parser-stress"]

[profile.dev]
# macOS: keep .dSYM out of the linker hot path (cuts incremental link time).
split-debuginfo = "unpacked"
# Line-table-only debug info — backtraces still work, ~50% smaller artifacts.
debug = "line-tables-only"

[profile.test]
inherits = "dev"

# Compile build scripts and proc-macros with optimization. Default cargo
# build-override inherits opt-level=0 from dev, which makes our
# `core-platform-pure` build script run the entire Pure compiler
# interpreted-equivalent against ~244 files / ~1660 elements on every
# cold build. opt-3 here is the single biggest cold-build win.
[profile.dev.build-override]
opt-level = 3
codegen-units = 16

[profile.test.build-override]
opt-level = 3
codegen-units = 16

# Heavy frontend deps that every crate transitively waits on. Compiling
# them unoptimized stretches the proc-macro expansion and serialization
# critical path; opt-3 once, reuse everywhere.
[profile.dev.package.syn]
opt-level = 3
[profile.dev.package.serde_derive]
opt-level = 3
[profile.dev.package.proc-macro2]
opt-level = 3
[profile.dev.package.quote]
opt-level = 3
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
