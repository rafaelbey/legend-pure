[workspace]
resolver = "2"
members = [
    "crates/ast",
    "crates/ast-derive",
    "crates/build",
    "crates/compose",
    "crates/lexer",
    "crates/parser",
    "crates/protocol",
    "crates/pure",
    "crates/runtime",
    "crates/jni",
    "crates/cli",
    "crates/core-platform-pure",
    "crates/snapshot-builder",
    "crates/dsl-diagram",
    "crates/dsl-graph",
    "crates/dsl-mapping",
    "crates/dsl-relational",
    "crates/dsl-store",
    "crates/dsl-tds",
    "crates/lsp",
    "crates/stress",
    "crates/xtask",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Apache-2.0"
repository = "https://github.com/finos/legend-engine"

[workspace.dependencies]
# Core
smol_str = "0.3"
thiserror = "2"
legend-pure-parser-ast-derive = { path = "crates/ast-derive" }

# Runtime (persistent data structures + heap + temporal + decimal)
im-rc = "15"
slotmap = "1"
rust_decimal = "1"
jiff = { version = "0.2", features = ["std"] }

# Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Parallelism
rayon = "1"

# Coverage (LCOV tracefile read/write/merge — only dep is thiserror)
lcov = "0.8"

# Serialization (protocol crate only)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# JNI
jni = "0.21"

# Plugins
linkme = "0.3"

# Testing
criterion = { version = "0.5", features = ["html_reports"] }
insta = { version = "1", features = ["json"] }
assert_cmd = "2"
predicates = "3"
tempfile = "3"

# Proc-macro (ast-derive)
syn = "2"
quote = "1"
proc-macro2 = "1"

# CLI
clap = { version = "4", features = ["derive", "color"] }
clap_complete = "4"
miette = { version = "7", features = ["fancy"] }
owo-colors = "4"
walkdir = "2"
rustyline = "18"
notify = "8.0.0"
notify-debouncer-mini = "0.7.0"

# LSP server
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }
dashmap = "6"

[workspace.metadata.llvm-cov]
# Exclude JNI bridge and stress tests from coverage
exclude = ["legend-pure-parser-jni", "legend-pure-parser-stress"]

[profile.dev]
# macOS: keep .dSYM out of the linker hot path (cuts incremental link time).
split-debuginfo = "unpacked"
# Line-table-only debug info — backtraces still work, ~50% smaller artifacts.
debug = "line-tables-only"

[profile.test]
inherits = "dev"
